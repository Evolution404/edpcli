name: Setup Python tooling
description: Install repository-pinned uv and enable caches for Python engineering scripts.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-python: true
