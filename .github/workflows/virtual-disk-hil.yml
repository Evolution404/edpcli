name: Virtual Disk HIL

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }} loop / raw-write-unmount-restore
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Run Linux virtual-disk HIL
        shell: bash
        run: bash scripts/ci/linux-virtual-disk-hil.sh

  windows:
    name: Windows ${{ matrix.arch }} VHD / raw-write-lock-dismount-restore
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-vs2026-arm
            arch: arm64
          - os: windows-2025
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Run Windows virtual-disk HIL
        shell: pwsh
        run: ./scripts/ci/windows-virtual-disk-hil.ps1
