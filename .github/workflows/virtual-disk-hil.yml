name: Virtual Disk HIL

on:
  push:
    paths:
      - "src/**"
      - "tests/virtual_disk_hil.rs"
      - "tests/plain_macos_virtual_hil.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/actions/setup-python-tooling/**"
      - ".github/release-platforms.json"
      - "scripts/ci/**"
      - ".github/workflows/virtual-disk-hil.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/virtual_disk_hil.rs"
      - "tests/plain_macos_virtual_hil.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/actions/setup-python-tooling/**"
      - ".github/release-platforms.json"
      - "scripts/ci/**"
      - ".github/workflows/virtual-disk-hil.yml"
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_facts:
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.build.outputs.linux }}
      windows: ${{ steps.build.outputs.windows }}
      platforms: ${{ steps.build.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tooling
      - id: build
        run: uv run --locked python scripts/ci/build_config.py

  linux:
    name: Linux ${{ matrix.arch }} loop / raw-write-unmount-restore
    needs: build_facts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build_facts.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tooling
      - name: Load build facts
        run: uv run --locked python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Run Linux virtual-disk HIL
        shell: bash
        run: bash scripts/ci/linux-virtual-disk-hil.sh

  macos:
    name: macOS arm64 disk-image / raw-write-unmount-restore
    needs: build_facts
    runs-on: ${{ fromJSON(needs.build_facts.outputs.platforms).macos_arm64.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tooling
      - name: Load build facts
        run: uv run --locked python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Run macOS protocol virtual-disk HIL
        shell: bash
        run: bash scripts/ci/macos-virtual-disk-hil.sh
      - name: Run macOS Plain virtual-disk HIL
        shell: bash
        run: bash scripts/ci/macos-plain-virtual-disk-hil.sh

  windows:
    name: Windows ${{ matrix.arch }} VHD / raw-write-lock-dismount-restore
    needs: build_facts
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build_facts.outputs.windows) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Python tooling
        uses: ./.github/actions/setup-python-tooling
      - name: Load build facts
        run: uv run --locked python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Run Windows virtual-disk HIL
        shell: pwsh
        run: ./scripts/ci/windows-virtual-disk-hil.ps1
