name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      protocol: ${{ steps.classify.outputs.protocol }}
      deps: ${{ steps.classify.outputs.deps }}
      primary: ${{ steps.build.outputs.primary }}
      secondary: ${{ steps.build.outputs.secondary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: build
        run: python3 scripts/ci/build_config.py
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi

          git diff --name-only --no-renames "${base}" "${GITHUB_SHA}" | python3 scripts/change_scope.py >> "${GITHUB_OUTPUT}"

  repository-audit:
    name: repository contract
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Check repository contracts
        run: cargo test --locked --test repository_suite --quiet

  protocol-audit:
    name: checked-in protocol gold audit
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Check protocol documentation contracts
        run: cargo test --locked --test protocol_suite --quiet
      - name: Verify checked-in LBA0-LBA12 gold set
        run: python3 scripts/protocol/audit_baseline.py

  supply-chain:
    name: dependency policy
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Cache pinned cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2
      - name: Install pinned cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses and sources
        run: cargo deny check

  rustfmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check

  quality-primary:
    name: ${{ matrix.label }} / full-clippy-release
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.primary) }}
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      EDPCLI_TEST_WORKERS: ${{ matrix.workers }}
      EDPCLI_TEST_THREADS: ${{ matrix.test_threads }}
      EDPCLI_TEST_MAX_SECONDS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
          components: clippy
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Full non-HIL test gate
        run: python scripts/test-full.py --profile full
      - name: Clippy is warning-free
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check release profile
        run: cargo check --release --all-targets --locked

  quality-secondary:
    name: ${{ matrix.label }} / compile-release
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.secondary) }}
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load build facts
        run: python scripts/ci/build_config.py
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.EDPCLI_RUST_TOOLCHAIN }}
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Compile all non-HIL targets
        run: cargo test --locked --no-run --all-targets
      - name: Check release profile
        run: cargo check --release --all-targets --locked
