name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      protocol: ${{ steps.classify.outputs.protocol }}
      deps: ${{ steps.classify.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "${GITHUB_SHA}")"
          fi

          rust=false
          protocol=false
          deps=false
          while IFS= read -r path; do
            [[ -z "${path}" ]] && continue
            case "${path}" in
              src/*|tests/*|scripts/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|.github/workflows/ci.yml)
                rust=true
                ;;
            esac
            case "${path}" in
              audit/protocol/*|scripts/protocol/*|docs/EDP_PROTOCOL*|src/protocol/*|tests/protocol*)
                protocol=true
                ;;
            esac
            case "${path}" in
              Cargo.toml|Cargo.lock|deny.toml|.github/dependabot.yml|.github/workflows/ci.yml)
                deps=true
                ;;
            esac
          done < <(git diff --name-only "${base}" "${GITHUB_SHA}")

          {
            echo "rust=${rust}"
            echo "protocol=${protocol}"
            echo "deps=${deps}"
          } >> "${GITHUB_OUTPUT}"

  repository-audit:
    name: repository contract
    needs: changes
    if: needs.changes.outputs.rust != 'true'
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Check repository contracts
        run: cargo test --locked --test repository_suite --quiet

  protocol-audit:
    name: checked-in protocol gold audit
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify checked-in LBA0-LBA12 gold set
        run: python3 scripts/protocol/audit_baseline.py

  supply-chain:
    name: dependency policy
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Cache pinned cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-0.20.2
      - name: Install pinned cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check advisories, licenses and sources
        run: cargo deny check

  rustfmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check

  quality-primary:
    name: ${{ matrix.label }} / full-clippy-release
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-2025
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
      EDPCLI_TEST_MAX_SECONDS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Full non-HIL test gate
        run: python scripts/test-full.py --profile full
      - name: Clippy is warning-free
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked

  quality-secondary:
    name: ${{ matrix.label }} / compile-release
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macos-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-11-vs2026-arm
            label: windows-arm64
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
      - name: Compile all non-HIL targets
        run: cargo test --locked --no-run --all-targets
      - name: Build release binary
        run: cargo build --release --locked
