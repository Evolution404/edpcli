name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.label }} / test-clippy-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-11-vs2026-arm
            label: windows-arm64
          - os: windows-2025
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test all targets
        run: cargo test --all-targets
      - name: Clippy is warning-free
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release
