name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Require tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo.toml ${expected_tag}" >&2
            exit 1
          fi

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build universal release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist package
          lipo -create \
            target/aarch64-apple-darwin/release/edpcli \
            target/x86_64-apple-darwin/release/edpcli \
            -output dist/edpcli
          chmod 0755 dist/edpcli
          artifact="edpcli-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && shasum -a 256 "${artifact}" > "${artifact}.sha256")
      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: package/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build Linux release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          mkdir -p dist package
          cp target/release/edpcli dist/edpcli
          chmod 0755 dist/edpcli
          artifact="edpcli-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && sha256sum "${artifact}" > "${artifact}.sha256")
      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: package/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build Windows release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item target\release\edpcli.exe dist\edpcli.exe
          $artifact = "edpcli-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Compress-Archive -Path dist\edpcli.exe -DestinationPath "package\$artifact"
          $hash = (Get-FileHash "package\$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "package\$artifact.sha256",
            "$hash  $artifact`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: package/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - macos
      - linux
      - windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "edpcli ${GITHUB_REF_NAME}" \
            --generate-notes
