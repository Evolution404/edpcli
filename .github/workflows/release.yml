name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Require tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo.toml ${expected_tag}" >&2
            exit 1
          fi

  macos_arm64:
    name: macOS arm64
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/edpcli version
          mkdir -p dist package
          cp target/release/edpcli dist/edpcli
          chmod 0755 dist/edpcli
          test "$(lipo -archs dist/edpcli)" = "arm64"
          artifact="edpcli-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && shasum -a 256 "${artifact}" > "${artifact}.sha256")
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-arm64
          path: package/*
          if-no-files-found: error

  macos_x86_64:
    name: macOS x86_64
    needs: version
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package macOS x86_64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/edpcli version
          mkdir -p dist package
          cp target/release/edpcli dist/edpcli
          chmod 0755 dist/edpcli
          test "$(lipo -archs dist/edpcli)" = "x86_64"
          artifact="edpcli-${GITHUB_REF_NAME}-macos-x86_64.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && shasum -a 256 "${artifact}" > "${artifact}.sha256")
      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-x86_64
          path: package/*
          if-no-files-found: error

  macos_universal:
    name: macOS universal
    needs:
      - macos_arm64
      - macos_x86_64
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: input/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-x86_64
          path: input/x86_64
      - name: Merge native binaries into Universal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted/arm64 extracted/x86_64 dist package
          tar -xzf "input/arm64/edpcli-${GITHUB_REF_NAME}-macos-arm64.tar.gz" -C extracted/arm64
          tar -xzf "input/x86_64/edpcli-${GITHUB_REF_NAME}-macos-x86_64.tar.gz" -C extracted/x86_64
          lipo -create extracted/arm64/edpcli extracted/x86_64/edpcli -output dist/edpcli
          chmod 0755 dist/edpcli
          archs="$(lipo -archs dist/edpcli)"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          artifact="edpcli-${GITHUB_REF_NAME}-macos-universal.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && shasum -a 256 "${artifact}" > "${artifact}.sha256")
      - name: Upload macOS universal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: package/*
          if-no-files-found: error

  linux_arm64:
    name: Linux arm64
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package Linux arm64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/edpcli version
          mkdir -p dist package
          cp target/release/edpcli dist/edpcli
          chmod 0755 dist/edpcli
          file dist/edpcli | grep -Eq 'ARM aarch64|ARM64'
          artifact="edpcli-${GITHUB_REF_NAME}-linux-arm64.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && sha256sum "${artifact}" > "${artifact}.sha256")
      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-arm64
          path: package/*
          if-no-files-found: error

  linux_x86_64:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          ./target/release/edpcli version
          mkdir -p dist package
          cp target/release/edpcli dist/edpcli
          chmod 0755 dist/edpcli
          file dist/edpcli | grep -q 'x86-64'
          artifact="edpcli-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C dist -czf "package/${artifact}" edpcli
          (cd package && sha256sum "${artifact}" > "${artifact}.sha256")
      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: package/*
          if-no-files-found: error

  windows_arm64:
    name: Windows arm64
    needs: version
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package Windows arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release
          $versionInfo = (& .\target\release\edpcli.exe version | Out-String)
          $versionInfo | Write-Host
          if ($versionInfo -notmatch "架构: arm64 \(aarch64\)") {
            throw "Windows arm64 runner produced a non-arm64 binary"
          }
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item target\release\edpcli.exe dist\edpcli.exe
          $artifact = "edpcli-$env:GITHUB_REF_NAME-windows-arm64.zip"
          Compress-Archive -Path dist\edpcli.exe -DestinationPath "package\$artifact"
          $hash = (Get-FileHash "package\$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "package\$artifact.sha256",
            "$hash  $artifact`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Upload Windows arm64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-arm64
          path: package/*
          if-no-files-found: error

  windows_x86_64:
    name: Windows x86_64
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy
      - name: Test and lint
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Build and package Windows x86_64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release
          $versionInfo = (& .\target\release\edpcli.exe version | Out-String)
          $versionInfo | Write-Host
          if ($versionInfo -notmatch "架构: x86_64 \(x86_64\)") {
            throw "Windows x86_64 runner produced a non-x86_64 binary"
          }
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item target\release\edpcli.exe dist\edpcli.exe
          $artifact = "edpcli-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Compress-Archive -Path dist\edpcli.exe -DestinationPath "package\$artifact"
          $hash = (Get-FileHash "package\$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            "package\$artifact.sha256",
            "$hash  $artifact`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Upload Windows x86_64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: package/*
          if-no-files-found: error

  metadata:
    name: Release dependency metadata
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Generate SBOM and dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp Cargo.lock "package/edpcli-${GITHUB_REF_NAME}-Cargo.lock"
          cargo metadata --locked --format-version 1 > "package/edpcli-${GITHUB_REF_NAME}-cargo-metadata.json"
          rustc -Vv > "package/edpcli-${GITHUB_REF_NAME}-rust-toolchain.txt"
          python3 scripts/ci/generate-cyclonedx-sbom.py \
            --commit "${GITHUB_SHA}" \
            --output "package/edpcli-${GITHUB_REF_NAME}-sbom.cdx.json"
          python3 -m json.tool "package/edpcli-${GITHUB_REF_NAME}-sbom.cdx.json" >/dev/null
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: package/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - macos_arm64
      - macos_x86_64
      - macos_universal
      - linux_arm64
      - linux_x86_64
      - windows_arm64
      - windows_x86_64
      - metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/generate-release-manifest.py \
            --assets-dir release-assets \
            --output "release-assets/edpcli-${GITHUB_REF_NAME}-release-manifest.json" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}"
          python3 -m json.tool "release-assets/edpcli-${GITHUB_REF_NAME}-release-manifest.json" >/dev/null
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "edpcli ${GITHUB_REF_NAME}" \
            --generate-notes
