name: TUI Cloud Maintenance

on:
  push:
    branches:
      - feat/tui-vim-interface-20260918

permissions:
  contents: write

jobs:
  format-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tui-vim-interface-20260918
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile
      - name: Commit cloud-generated maintenance output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No maintenance changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src tests
          git diff --cached --check
          git commit -m "chore: refresh TUI lockfile and formatting"
          git push origin HEAD:feat/tui-vim-interface-20260918
