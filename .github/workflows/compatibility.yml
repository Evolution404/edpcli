name: Future Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  latest:
    name: ${{ matrix.label }} / latest stable Rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-11-vs2026-arm
            label: windows-arm64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: Test all targets
        run: cargo test --all-targets
      - name: Clippy is warning-free
        run: cargo clippy --all-targets -- -D warnings
