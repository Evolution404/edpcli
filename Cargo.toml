[package]
name = "edpcli"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
description = "EDP/cems U 盘管理 CLI（识别、元信息、备份、恢复与免密转换；纯 Rust 标准库，零依赖）"
license = "MIT"
publish = false

[lib]
name = "edpcli"
path = "src/lib.rs"

[[bin]]
name = "edpcli"
path = "src/main.rs"

[profile.release]
strip = true
