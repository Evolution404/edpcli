[package]
name = "edpcli"
version = "2.4.0"
edition = "2021"
rust-version = "1.98"
description = "EDP/cems U 盘管理 CLI（识别、元信息、备份、恢复与免密转换）"
license = "MIT"
publish = false
autotests = false

[lib]
name = "edpcli"
path = "src/lib.rs"

[[bin]]
name = "edpcli"
path = "src/main.rs"

[features]
default = []
# 仅供 CI 在 GitHub-hosted Runner 的临时 loop/VHD 上做 HIL-lite。
# 正式 Release 永不启用；平台实现还会再次验证目标确实是虚拟块设备。
ci-virtual-disk = []


[[test]]
name = "cli_suite"
path = "tests/cli_suite.rs"

[[test]]
name = "backup_suite"
path = "tests/backup_suite.rs"

[[test]]
name = "inspect_suite"
path = "tests/inspect_suite.rs"

[[test]]
name = "protocol_suite"
path = "tests/protocol_suite.rs"

[[test]]
name = "provision_suite"
path = "tests/provision_suite.rs"

[[test]]
name = "tui_suite"
path = "tests/tui_suite.rs"

[[test]]
name = "platform_suite"
path = "tests/platform_suite.rs"

[[test]]
name = "repository_suite"
path = "tests/repository_suite.rs"

[[test]]
name = "virtual_disk_hil"
path = "tests/virtual_disk_hil.rs"
required-features = ["ci-virtual-disk"]

[[test]]
name = "plain_macos_virtual_hil"
path = "tests/plain_macos_virtual_hil.rs"
required-features = ["ci-virtual-disk"]

[profile.release]
strip = true

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
encoding_rs = "0.8"
getrandom = "0.3"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "parsing", "formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
