[project]
name = "edpcli-tools"
version = "0.0.0"
description = "Python engineering tooling for the edpcli Rust repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
protocol = [
    "capstone>=5.0.7,<6",
    "pefile>=2024.8.26",
    "unicorn>=2.1.4,<3",
]

[tool.uv]
package = false
python-preference = "only-managed"
required-version = ">=0.12.23,<0.13"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
